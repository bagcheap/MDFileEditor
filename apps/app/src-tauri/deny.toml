# cargo-deny policy (SECURITY.md §1). Run: cargo deny check

[graph]
# The app ships for macOS; also check Linux so CI on Ubuntu covers the same graph shape.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]

[advisories]
# Fail on any RustSec vulnerability; yanked crates are errors too.
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "Zlib",
  "Unicode-3.0",
  # Weak, file-level copyleft. Used by Mozilla's CSS parser crates
  # (cssparser, selectors, ...) inside Tauri's build tooling. Fine for a private app.
  "MPL-2.0",
]

[licenses.private]
# Our own crate is not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
